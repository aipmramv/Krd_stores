name: OSM snapshot

# Run manually to save the OpenStreetMap data used by the app (and a lookup of named KONE places)
# to the osm-snapshot branch, so the site models can be checked against real footprints offline.
on:
  workflow_dispatch:
    inputs:
      imagery:
        description: 'Optional "lat,lon" to save a 3 × 3 km satellite mosaic around (Esri World Imagery, zoom 16)'
        default: ''

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Site data (same fetcher as the Pages deploy)
        if: inputs.imagery == ''
        working-directory: app
        timeout-minutes: 15
        run: npm ci --ignore-scripts && node scripts/fetch-osm.ts
      - name: Named KONE places around Chennai
        timeout-minutes: 8
        continue-on-error: true
        run: |
          mkdir -p snapshot
          cp app/public/osm/*.json snapshot/ 2>/dev/null || git show origin/osm-snapshot:snapshot/isu.json >/dev/null 2>&1 || true
          q='[out:json][timeout:60];(nwr["name"~"KONE",i](12.7,79.7,13.3,80.4);nwr["operator"~"KONE",i](12.7,79.7,13.3,80.4);nwr["brand"~"KONE",i](12.7,79.7,13.3,80.4););out center tags;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.osm.jp/api/interpreter; do
            curl -sf --max-time 60 -A 'KONE-Materials-Twin/1.0' --data-urlencode "data=$q" "$ep" -o snapshot/kone-named.json && break
          done
          curl -sf --max-time 60 -A 'KONE-Materials-Twin/1.0 (+https://github.com/aipmramv/Krd_stores)' 'https://nominatim.openstreetmap.org/search?q=KONE+Elevator+Sriperumbudur&format=json&limit=10' -o snapshot/nominatim-kone.json || true
          curl -sf --max-time 60 -A 'KONE-Materials-Twin/1.0 (+https://github.com/aipmramv/Krd_stores)' 'https://nominatim.openstreetmap.org/search?q=Irungattukottai+Irumbedu+Road&format=json&limit=10' -o snapshot/nominatim-road.json || true
          q2='[out:json][timeout:60];way["highway"]["name"~"Irumb|Irrumb|Irung|Pennalur|Pillaipakkam",i](12.85,79.85,13.1,80.1);out center tags;'
          curl -sf --max-time 60 -A 'KONE-Materials-Twin/1.0' --data-urlencode "data=$q2" https://overpass-api.de/api/interpreter -o snapshot/roads-named.json || true
          ls -la snapshot
      - name: Satellite mosaic
        if: inputs.imagery != ''
        run: |
          python3 - "${{ inputs.imagery }}" <<'PY'
          import math, sys, urllib.request, io
          from PIL import Image
          lat, lon = map(float, sys.argv[1].split(','))
          z = 16; n = 2 ** z
          fx = (lon + 180) / 360 * n
          fy = (1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n
          cx, cy, R = int(fx), int(fy), 4
          img = Image.new('RGB', ((2 * R + 1) * 256,) * 2)
          for dx in range(-R, R + 1):
              for dy in range(-R, R + 1):
                  url = f'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{cy + dy}/{cx + dx}'
                  data = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'KONE-Materials-Twin/1.0'}), timeout=30).read()
                  img.paste(Image.open(io.BytesIO(data)), ((dx + R) * 256, (dy + R) * 256))
          img.save('snapshot/imagery.jpg', quality=88)
          # Tile origin, so pixels can be turned back into latitude/longitude.
          open('snapshot/imagery.txt', 'w').write(f'z={z} x0={cx - R} y0={cy - R} tiles={2 * R + 1}\n')
          PY
      - name: Commit to the osm-snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan osm-snapshot
          git rm -rfq --cached .
          git add -f snapshot
          git commit -qm "OSM snapshot $(date -u +%F)"
          git push -f origin osm-snapshot
