name: CI

# Typecheck, unit tests and build for the app; the API against a real MongoDB with a smoke test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: API smoke test against MongoDB
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          ALLOW_RESET: 'true'
        run: |
          npm start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 1; done
          npm run smoke || { cat api.log; exit 1; }
